[package]
name = "job-radar-desktop"
version = "0.1.0"
description = "Local-first job search tracker"
license = "MIT"
edition = "2024"

[lib]
# The _lib suffix keeps the lib name distinct from the bin (cargo#8519 on Windows).
name = "job_radar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
rusqlite = { version = "0.41", features = ["bundled"] }
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
dirs = "7"
regex = "1"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
